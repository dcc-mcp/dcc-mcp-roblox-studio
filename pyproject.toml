[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-roblox-studio"
version = "0.1.1"
description = "Roblox Studio adapter for the DCC Model Context Protocol ecosystem"
authors = [{ name = "Long Hao", email = "hal.long@outlook.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["roblox", "roblox-studio", "mcp", "dcc", "ai", "llm", "luau"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]
dependencies = [
    "dcc-mcp-core>=0.20.54,<0.21.0",
    "websockets>=12,<16",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "hatchling>=1.25",
    "pytest>=8.0",
    "ruff>=0.8.0,<0.17.0",
]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-roblox-studio"
Repository = "https://github.com/dcc-mcp/dcc-mcp-roblox-studio"
Issues = "https://github.com/dcc-mcp/dcc-mcp-roblox-studio/issues"
Changelog = "https://github.com/dcc-mcp/dcc-mcp-roblox-studio/releases"

[project.scripts]
dcc-mcp-roblox-studio = "dcc_mcp_roblox_studio.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_roblox_studio"]

[tool.hatch.build.targets.wheel.force-include]
"plugin" = "dcc_mcp_roblox_studio/_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dcc_mcp_roblox_studio"]
